<!doctype html>
<!--
  The image that shows when a link to the home page is shared (og-image.png at the root, 1200 x 630 px).
  Make the PNG again with the command in README.md. This folder starts with an underscore, so GitHub Pages does not publish it.
  Colours and the logo follow the brand guide in joomiz/platform: the dark ground, Fog for text, and Light blue as the one accent.
  The full wordmark is used large and alone, because its cut is thin. Do not put the mark next to it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Joomiz social image</title>
<style>
  :root { --ground: #0b1220; --fog: #f4f6fa; --muted: #a5aab2; --soft: #1d2533; --line: #313846; --blue: #5c86ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
  body {
    position: relative; padding: 56px 80px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--fog);
  }
  img { display: block; width: 280px; height: auto; }
  h1 { margin-top: 36px; font-size: 70px; line-height: 1.04; font-weight: 800; letter-spacing: -0.025em; text-wrap: balance; }
  p { margin-top: 16px; font-size: 32px; line-height: 1.3; color: var(--muted); }
  pre {
    position: absolute; left: 80px; right: 80px; bottom: 48px; padding: 20px 30px;
    border: 2px solid var(--line); border-radius: 16px; background: var(--soft);
    font: 500 26px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; color: var(--fog);
  }
  .dim { color: var(--muted); }
  .path { color: var(--blue); }
</style>
</head>
<body>
<img src="wordmark-full.on-dark.svg" alt="Joomiz">
<h1>A golden path from your platform team.</h1>
<p>Every change is planned first.</p>
<pre><span class="dim">application:</span>
<span class="dim">  name:</span> inventory-api
<span class="dim">  golden-path:</span> <span class="path">java-web-application</span></pre>
</body>
</html>
