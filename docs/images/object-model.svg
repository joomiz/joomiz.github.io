<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The things in Joomiz and how they relate</title>
  <desc id="d">An owner owns an application. The application is submitted as revisions, declares artifacts and tooling once, and has environments. An environment has resources, and each resource has a type. The catalog defines types, and a provisioner handles them. A revision is planned as a plan, and the plan is then applied. A plan and an apply are saved as runs. An apply writes the applied state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#0B3BC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1240" height="560" rx="24" fill="#F4F6FA"/>

  <!-- arrows -->
  <g fill="none" stroke="#0B3BC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 72 H390" marker-end="url(#arrow)"/>
    <path d="M590 72 H740" marker-end="url(#arrow)"/>
    <path d="M490 104 V170" marker-end="url(#arrow)"/>
    <path d="M410 104 V137 H140 V170" marker-end="url(#arrow)"/>
    <path d="M490 234 V300" marker-end="url(#arrow)"/>
    <path d="M390 316 H240" marker-end="url(#arrow)"/>
    <path d="M140 430 V364" marker-end="url(#arrow)"/>
    <path d="M390 462 H300 V348 H240" marker-end="url(#arrow)"/>
    <path d="M840 104 V170" marker-end="url(#arrow)"/>
    <path d="M840 234 V300" marker-end="url(#arrow)"/>
    <path d="M840 364 V430" marker-end="url(#arrow)"/>
    <path d="M940 202 H1100 V235" marker-end="url(#arrow)"/>
    <path d="M940 332 H1100 V299" marker-end="url(#arrow)"/>
  </g>

  <!-- arrow labels -->
  <g font-size="13" fill="#5B6475">
    <text x="315" y="62" text-anchor="middle">owns</text>
    <text x="665" y="62" text-anchor="middle">is submitted as</text>
    <text x="500" y="141">has</text>
    <text x="275" y="128" text-anchor="middle">declares</text>
    <text x="500" y="271">has</text>
    <text x="315" y="306" text-anchor="middle">has a</text>
    <text x="150" y="403">defines</text>
    <text x="308" y="420">handles</text>
    <text x="850" y="141">is planned as</text>
    <text x="850" y="271">is applied as</text>
    <text x="850" y="401">writes</text>
    <text x="1020" y="194" text-anchor="middle">is saved as</text>
    <text x="1020" y="352" text-anchor="middle">is saved as</text>
  </g>

  <!-- boxes -->
  <g fill="#FFFFFF" stroke="#0B3BC4" stroke-width="2">
    <rect x="40" y="40" width="200" height="64" rx="12"/>
    <rect x="40" y="170" width="200" height="64" rx="12"/>
    <rect x="40" y="300" width="200" height="64" rx="12"/>
