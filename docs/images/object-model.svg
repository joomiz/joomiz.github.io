  <g font-size="13" fill="#5B6475">
    <text x="58" y="88">the team in owner</text>
    <text x="58" y="218">declared once per file</text>
    <text x="58" y="348">a name from the catalog</text>
    <text x="58" y="478">the types a platform offers</text>
