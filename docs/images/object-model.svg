    <text x="58" y="328">Type</text>
    <text x="58" y="458">Catalog</text>
    <text x="408" y="68">Application</text>
    <text x="408" y="198">Environment</text>
    <text x="408" y="328">Resource</text>
    <text x="408" y="458">Provisioner</text>
    <text x="758" y="68">Revision</text>
